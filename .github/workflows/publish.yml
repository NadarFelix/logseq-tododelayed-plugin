name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create zip
        run: zip -r logseq-todo-delayed-${{ github.ref_name }}.zip index.html package.json manifest.json README.md LICENSE icon.png

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: logseq-todo-delayed-${{ github.ref_name }}.zip
